name: Daily Thrive

# One hourly cron drives both modes. The script does a full refresh at the
# scheduled daily hour (UTC) and a podcast-only refresh every other hour, so
# rolling-URI shows like tagesschau stay current without re-shuffling music.
on:
  schedule:
    - cron: "23 * * * *"   # every hour at :23 (off-the-hour to dodge GH Actions cron queue)
  workflow_dispatch: {}     # manual trigger from the Actions tab

# UTC hour at which to do the full rebuild. 06 UTC = 08:23 Berlin in summer (CEST),
# 07:23 in winter (CET). Every other hourly run does podcast-only.
env:
  FULL_REFRESH_HOUR_UTC: "06"

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated episode-history.json back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      # state.json holds the music_tracks selected on the daily full refresh.
      # Hourly podcast-only runs reuse it so the music doesn't change between
      # daily refreshes. Cache restores the most recent state.json before the
      # run and saves the updated one after (unique key per run, prefix fallback).
      - name: Restore music state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: dailythrive-state-${{ github.run_id }}
          restore-keys: dailythrive-state-

      - name: Restore secret files
        env:
          SPOTIFY_CONFIG: ${{ secrets.SPOTIFY_CONFIG }}
          SPOTIFY_TOKEN: ${{ secrets.SPOTIFY_TOKEN }}
        run: |
          printf '%s' "$SPOTIFY_CONFIG" > config.yaml
          printf '%s' "$SPOTIFY_TOKEN" > .spotify-token.json

      - name: Build playlist (full refresh once daily, podcast-only otherwise)
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "$FULL_REFRESH_HOUR_UTC" ]; then
            echo "→ Daily full refresh (UTC hour=$HOUR)"
            npm start
          else
            echo "→ Hourly podcast-only refresh (UTC hour=$HOUR)"
            node index.js --podcast-only
          fi

      - name: Commit updated episode history (only if it changed)
        run: |
          if [ -n "$(git status --porcelain episode-history.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add episode-history.json
            git commit -m "chore: update episode history [skip ci]"
            git push
          else
            echo "No changes to episode-history.json"
          fi
