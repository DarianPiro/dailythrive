name: Daily Thrive

# Two distinct schedules so the mode is decided by GitHub at trigger time
# (via github.event.schedule), not by the runner's wall clock — that way
# Actions cron delays can't accidentally skip the daily full refresh.
on:
  schedule:
    - cron: "23 6 * * *"         # DAILY FULL REFRESH — 08:23 Berlin (CEST) / 07:23 (CET)
    - cron: "23 0-5,7-23 * * *"  # HOURLY PODCAST-ONLY (every hour except 06 UTC)
  workflow_dispatch: {}           # manual trigger → defaults to full refresh

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated episode-history.json back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      # state.json holds the music_tracks selected on the daily full refresh.
      # Hourly podcast-only runs reuse it so the music doesn't change between
      # daily refreshes. Cache restores the most recent state.json before the
      # run and saves the updated one after (unique key per run, prefix fallback).
      - name: Restore music state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: dailythrive-state-${{ github.run_id }}
          restore-keys: dailythrive-state-

      - name: Restore secret files
        env:
          SPOTIFY_CONFIG: ${{ secrets.SPOTIFY_CONFIG }}
          SPOTIFY_TOKEN: ${{ secrets.SPOTIFY_TOKEN }}
        run: |
          printf '%s' "$SPOTIFY_CONFIG" > config.yaml
          printf '%s' "$SPOTIFY_TOKEN" > .spotify-token.json

      # Mode is determined by which cron fired (not by wall-clock hour).
      # Manual workflow_dispatch has no schedule → defaults to full refresh.
      - name: Build playlist
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "23 0-5,7-23 * * *" ]; then
            echo "→ Hourly podcast-only refresh (schedule: $SCHEDULE)"
            node index.js --podcast-only
          else
            echo "→ Daily full refresh (schedule: ${SCHEDULE:-manual})"
            npm start
          fi

      - name: Commit updated episode history (only if it changed)
        run: |
          if [ -n "$(git status --porcelain episode-history.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add episode-history.json
            git commit -m "chore: update episode history [skip ci]"
            git push
          else
            echo "No changes to episode-history.json"
          fi
