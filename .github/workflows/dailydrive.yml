name: Daily Drive

on:
  schedule:
    - cron: "0 6 * * *"    # 08:00 Berlin (summer) / 07:00 (winter) — morning
    - cron: "0 14 * * *"   # 16:00 Berlin (summer) / 15:00 (winter) — afternoon
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Restore secret files
        run: |
          printf '%s' '${{ secrets.SPOTIFY_CONFIG }}' > config.yaml
          printf '%s' '${{ secrets.SPOTIFY_TOKEN }}'  > .spotify-token.json

      - run: npm start
